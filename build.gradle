// SextiarySector3 — port 1.10.2 -> 1.12.2 (ForgeGradle 3, JDK8 build -> Cleanroom/Java25)
// Depends on MCEconomy3 + MCEconomy3Compat (dev jars in ./libs) and JEI 1.12.2.
// Original kept as build.gradle.orig-fg2
buildscript {
    repositories {
        maven { url = 'https://maven.minecraftforge.net/' }
        mavenCentral()
    }
    dependencies {
        classpath 'net.minecraftforge.gradle:ForgeGradle:3.+'
    }
}

apply plugin: 'net.minecraftforge.gradle'
apply plugin: 'eclipse'

tasks.withType(JavaCompile) { options.encoding = 'UTF-8' }

version = '1.3.6'
group = 'shift.sextiarysector3'
archivesBaseName = 'sextiarysector3-1.12.2'

sourceCompatibility = targetCompatibility = compileJava.sourceCompatibility = compileJava.targetCompatibility = '1.8'

minecraft {
    mappings channel: 'snapshot', version: '20171003-1.12'
    runs {
        client { workingDirectory project.file('run') }
        server { workingDirectory project.file('run') }
    }
}

repositories {
    mavenCentral()
    maven { url = 'https://modmaven.dev/' }        // JEI 1.12.2
    maven { url = 'https://dvs1.progwml6.com/files/maven/' }
    flatDir { dirs 'libs' }
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.12.2-14.23.5.2860'
    implementation files('libs/mceconomy3-1.12.2-1.1.2-dev.jar')
    implementation files('libs/mceconomy3compat-1.12.2-1.0.1-dev.jar')
    // JEI 1.12.2 — deobf so it compiles in the dev workspace
    implementation fg.deobf('mezz.jei:jei_1.12.2:4.16.1.302')
}

processResources {
    inputs.property 'version', project.version
    inputs.property 'mcversion', '1.12.2'
    from(sourceSets.main.resources.srcDirs) {
        include 'mcmod.info'
        expand 'version': project.version, 'mcversion': '1.12.2'
    }
    from(sourceSets.main.resources.srcDirs) {
        exclude 'mcmod.info'
    }
}

jar {
    manifest {
        attributes([
            'Specification-Title'   : 'sextiarysector3',
            'Specification-Vendor'  : 'Shift',
            'Specification-Version' : '1',
            'Implementation-Title'  : project.name,
            'Implementation-Version': "${version}",
            'Implementation-Vendor' : 'Shift'
        ])
    }
}

jar.finalizedBy('reobfJar')

task devJar(type: Jar) {
    from sourceSets.main.output
    classifier = 'dev'
}
artifacts { archives devJar }
